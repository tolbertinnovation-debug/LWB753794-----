<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>About LIB Browser</title>
    <link rel="stylesheet" href="/_shared/base.css" />
    <style>
      .hero {
        text-align: center;
        padding: 64px 20px 28px;
      }
      .hero .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        filter: drop-shadow(0 18px 40px rgba(99, 102, 241, 0.35));
      }
      .hero h1 {
        font-size: 36px;
        margin: 0 0 6px;
      }
      .hero p {
        color: var(--text-2);
        margin: 0;
        font-size: 16px;
      }
      .versions {
        max-width: 560px;
        margin: 0 auto;
      }
      .versions .setting .title {
        font-weight: 500;
        color: var(--text-2);
      }
      .versions code {
        font-family: var(--mono);
        font-size: 13px;
      }
      .features {
        max-width: 860px;
        margin: 28px auto 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .feature {
        padding: 18px;
      }
      .feature .ic {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 13%, transparent);
        color: var(--accent);
        margin-bottom: 10px;
      }
      .feature h3 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .feature p {
        margin: 0;
        color: var(--text-2);
        font-size: 13px;
      }
      .credits {
        text-align: center;
        color: var(--text-3);
        font-size: 12.5px;
        margin-top: 36px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><path d="M24 17v30h19" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43.5" cy="21.5" r="5.2" fill="#fff"/></svg>
        <h1>LIB Browser</h1>
        <p>Fast. Private. Beautiful.</p>
      </div>
      <div class="card versions"><div class="card-body" id="versions"></div></div>
      <div class="features" id="features"></div>
      <p class="credits">
        Built on Chromium and Electron. Ad &amp; tracker blocking by the Ghostery engine with EasyList, EasyPrivacy and uBlock Origin lists. Reader mode by Mozilla Readability.<br />
        <a href="https://github.com/tolbertinnovation-debug/Lib-Web-browser">Source code on GitHub</a>
      </p>
    </div>
    <script type="module" src="about.js"></script>
  </body>
</html>
