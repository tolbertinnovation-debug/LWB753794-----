name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system packages (virtual display, real-keystroke helper)
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-xlib

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: xvfb-run -a -s "-screen 0 1280x800x24" npm run test:e2e
