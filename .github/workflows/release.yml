name: Build installers

# Builds Windows, macOS and Linux installers.
# - Push a tag like "v1.0.0" to publish them as a GitHub Release.
# - Or run it manually (Actions › Build installers › Run workflow): enter a
#   release tag to publish a GitHub Release (the tag is created on the chosen
#   branch), or leave it empty and download the installers from the run's
#   "Artifacts" section.

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build installers.
        required: false
        default: ''

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Linux
            os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set automatic build version
        if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version.split('-')[0]")
          npm version "${version}-build.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Unit tests
        run: npm test

      - name: Bundle ad & tracker filter lists
        run: npm run build:adblock

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: LIB-Browser-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/release-notes

      - name: Select release tag
        if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
        run: |
          version=$(git show "${GITHUB_SHA}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version.split('-')[0]))")
          echo "TAG=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Release notes come from docs/release-notes/<tag>.md when that file exists.
      - name: Release notes
        run: |
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: LIB Browser ${{ env.TAG }}
          body_path: ${{ runner.temp }}/notes.md
          files: artifacts/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
